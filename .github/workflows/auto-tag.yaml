on:
  push:
    branches:
      - main

name: Auto-tag

# Serialized so two pushes landing close together can't both compute the same
# "next" version and race to push the same tag.
concurrency:
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version and tag
        # Pushing a branch (not a tag) can't retrigger this workflow, so no loop
        # risk on this step itself.
        run: |
          git fetch --tags
          latest=$(git tag -l 'v*.*.*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            new="v0.1.0"
          else
            ver="${latest#v}"
            major="${ver%%.*}"
            rest="${ver#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            new="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Latest: ${latest:-<none>} -> New: $new"
          echo "NEW_TAG=$new" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$new"
          git push origin "$new"

      - name: Trigger AppImage build
        # A tag pushed with the default GITHUB_TOKEN (above) does NOT trigger
        # other workflows' `push: tags` filters - GitHub Actions deliberately
        # blocks GITHUB_TOKEN-authored events from cascading, to prevent
        # infinite workflow loops. Dispatch desktop-build.yaml explicitly
        # instead, on the tag we just pushed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run desktop-build.yaml --ref "$NEW_TAG"
