on:
  push:
    tags:
      - 'v*'
  # auto-tag.yaml pushes the tag above using the default GITHUB_TOKEN, and
  # GitHub Actions deliberately doesn't let a GITHUB_TOKEN-authored push
  # trigger other workflows (anti-recursion guard) - so it dispatches this
  # workflow explicitly instead. Manual `git push --tags` still hits the
  # trigger above just fine, since that uses a real user token.
  workflow_dispatch:

name: Desktop AppImage Build

jobs:
  build-appimage:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # Must run before actions/checkout: without a system `git`, checkout falls
      # back to downloading a plain tarball (no .git directory), which then
      # breaks dunamai's `git describe`-based version detection even once git
      # itself gets installed later - checkout doesn't retroactively re-clone.
      - name: Install system dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            webkit2gtk-4.1 base-devel curl wget file openssl \
            appmenu-gtk-module libappindicator-gtk3 librsvg \
            python python-pip git xdg-utils fuse2 \
            xdotool jq nodejs npm
          # Container runs as root, checked-out files end up owned by a different
          # uid than git expects by default, and git refuses to touch a repo it
          # doesn't consider "ours" (dubious ownership, CVE-2022-24765 mitigation).
          # Blanket-trust everything in this throwaway container.
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-appimage

      - name: Install pnpm
        run: npm install -g pnpm

      - uses: mtkennerly/dunamai-action@v1
        with:
          env-var: LUDUSAVI_VERSION
          args: --style semver
        env:
          # dunamai-action plain `pip install`s itself, which Arch's pip refuses
          # by default (PEP 668 externally-managed-environment). This is the
          # standard override, not a real risk here - it's a throwaway CI container.
          PIP_BREAK_SYSTEM_PACKAGES: "1"

      - name: Inject version into tauri.conf.json
        run: |
          jq --arg v "$LUDUSAVI_VERSION" '.version = $v' \
            desktop/src-tauri/tauri.conf.json > desktop/src-tauri/tauri.conf.json.tmp
          mv desktop/src-tauri/tauri.conf.json.tmp desktop/src-tauri/tauri.conf.json

      - name: Build AppImage
        # Same script/recipe as local one-shot builds (README "Building" ->
        # desktop/scripts/build-appimage.sh) - one build process, not a second
        # CI-only one that can drift. It also sets NO_STRIP=1, needed here: this
        # Arch container's binutils emits `.relr.dyn` ELF sections that Tauri's
        # bundled linuxdeploy ships a `strip` too old to handle.
        run: ./desktop/scripts/build-appimage.sh

      - name: Rename AppImage with version
        run: mv Ludusavi-Sync.AppImage "Ludusavi-Sync-v${LUDUSAVI_VERSION}.AppImage"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: Ludusavi-Sync-v${{ env.LUDUSAVI_VERSION }}.AppImage
