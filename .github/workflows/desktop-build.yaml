on:
  push:
    tags:
      - 'v*'
  # auto-tag.yaml pushes the tag above using the default GITHUB_TOKEN, and
  # GitHub Actions deliberately doesn't let a GITHUB_TOKEN-authored push
  # trigger other workflows (anti-recursion guard) - so it dispatches this
  # workflow explicitly instead. Manual `git push --tags` still hits the
  # trigger above just fine, since that uses a real user token.
  workflow_dispatch:

name: Desktop AppImage Build

permissions:
  contents: write

jobs:
  build-appimage:
    # Ubuntu 22.04 (glibc 2.35), not a rolling-release Arch container: an
    # AppImage bundles its runtime libs (webkit2gtk, glib, ...) as compiled,
    # and those still need a glibc on the *target* machine new enough to
    # satisfy the symbol versions they were built against. glibc is
    # backwards-compatible, not forwards-compatible, so building on Arch's
    # bleeding-edge glibc produced an AppImage that flatly wouldn't run on a
    # Steam Deck (SteamOS 3.8.16 ships glibc 2.41 - a whole version behind
    # what that build required). Building on an older LTS base is the
    # standard AppImage practice for exactly this reason, and it's also
    # Tauri's own documented Linux CI baseline - the plain GitHub-hosted
    # runner has git/python/FUSE already, sidestepping every Arch-container
    # workaround (missing git, PEP 668 pip, missing FUSE, gdk-pixbuf loader
    # cache) this workflow needed before.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-appimage-ubuntu

      - name: Install system dependencies
        # Tauri's own documented Ubuntu prerequisite list, plus jq (version
        # injection below) and xdg-utils (linuxdeploy shells out to xdg-open
        # while bundling). libwebkit2gtk-4.1-dev is deliberately NOT here -
        # see "Pin libwebkit2gtk" below, it needs a specific old version, not
        # whatever's currently in jammy-updates.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libxcb-composite0-dev \
            jq xdg-utils

      - name: Pin libwebkit2gtk to a pre-regression version
        # WebKitGTK versions after 2.44.x crash on startup under gamescope on
        # Steam Deck (and other Wayland-adjacent compositors/GPU combos):
        # "Could not create default EGL display: EGL_BAD_PARAMETER. Aborting
        # ..." in the WebKitWebProcess, leaving just a blank window - a
        # WebKit regression several other Tauri/Electron-alternative apps
        # hit the same way (gitbutlerapp/gitbutler#5282 + #5301,
        # NoRiskClient/issues#597). Confirmed LIVE on real Deck hardware for
        # this app: strace + a wide battery of env vars (WEBKIT_DISABLE_*,
        # LIBGL_ALWAYS_SOFTWARE, GDK_BACKEND=x11, EGL_PLATFORM=x11,
        # WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1, alone and combined) do
        # NOT avoid it - see desktop/src-tauri/src/lib.rs::run for the full
        # writeup. jammy-updates now ships well past the break (2.50.x as of
        # writing); pull the last known-good series (2.44.3-0ubuntu0.22.04.1,
        # current from 2024-09-05 to 2024-10-12 before 2.46 superseded it)
        # from Ubuntu's archive snapshot service instead, and hold it so
        # nothing later in this job upgrades it back. Full `apt-get update`
        # (not restricted to just this new source via Dir::Etc::sourcelist) -
        # verified via a local Ubuntu-22.04 rebuild that restricting it drops
        # jammy/jammy-updates main+universe from apt's lists (List-Cleanup),
        # which then breaks dependency resolution for these packages
        # (gstreamer1.0-plugins-*, libsecret-1-0, libhyphen0, etc. all live
        # in main/universe, not this snapshot-only source).
        run: |
          echo "deb http://snapshot.ubuntu.com/ubuntu/20240920T000000Z jammy-updates main universe" | \
            sudo tee /etc/apt/sources.list.d/webkit-pin.list
          sudo apt-get update
          sudo apt-get install -y --allow-downgrades \
            libwebkit2gtk-4.1-0=2.44.3-0ubuntu0.22.04.1 \
            libwebkit2gtk-4.1-dev=2.44.3-0ubuntu0.22.04.1 \
            libjavascriptcoregtk-4.1-0=2.44.3-0ubuntu0.22.04.1 \
            libjavascriptcoregtk-4.1-dev=2.44.3-0ubuntu0.22.04.1 \
            gir1.2-webkit2-4.1=2.44.3-0ubuntu0.22.04.1 \
            gir1.2-javascriptcoregtk-4.1=2.44.3-0ubuntu0.22.04.1
          sudo apt-mark hold \
            libwebkit2gtk-4.1-0 libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-0 libjavascriptcoregtk-4.1-dev

      - name: Install pnpm
        run: npm install -g pnpm

      - uses: mtkennerly/dunamai-action@v1
        with:
          env-var: LUDUSAVI_VERSION
          args: --style semver

      - name: Inject version into tauri.conf.json
        run: |
          jq --arg v "$LUDUSAVI_VERSION" '.version = $v' \
            desktop/src-tauri/tauri.conf.json > desktop/src-tauri/tauri.conf.json.tmp
          mv desktop/src-tauri/tauri.conf.json.tmp desktop/src-tauri/tauri.conf.json

      - name: Build AppImage
        # Same script/recipe as local one-shot builds (README "Building" ->
        # desktop/scripts/build-appimage.sh) - one build process, not a second
        # CI-only one that can drift.
        run: ./desktop/scripts/build-appimage.sh

      - name: Rename AppImage with version
        run: mv Ludusavi-Sync.AppImage "Ludusavi-Sync-v${LUDUSAVI_VERSION}.AppImage"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: Ludusavi-Sync-v${{ env.LUDUSAVI_VERSION }}.AppImage
