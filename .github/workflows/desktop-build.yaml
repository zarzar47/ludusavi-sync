on:
  push:
    tags:
      - 'v*'
  # auto-tag.yaml pushes the tag above using the default GITHUB_TOKEN, and
  # GitHub Actions deliberately doesn't let a GITHUB_TOKEN-authored push
  # trigger other workflows (anti-recursion guard) - so it dispatches this
  # workflow explicitly instead. Manual `git push --tags` still hits the
  # trigger above just fine, since that uses a real user token.
  workflow_dispatch:

name: Desktop AppImage Build

permissions:
  contents: write

jobs:
  build-appimage:
    # Ubuntu 22.04 (glibc 2.35), not a rolling-release Arch container: an
    # AppImage bundles its runtime libs (webkit2gtk, glib, ...) as compiled,
    # and those still need a glibc on the *target* machine new enough to
    # satisfy the symbol versions they were built against. glibc is
    # backwards-compatible, not forwards-compatible, so building on Arch's
    # bleeding-edge glibc produced an AppImage that flatly wouldn't run on a
    # Steam Deck (SteamOS 3.8.16 ships glibc 2.41 - a whole version behind
    # what that build required). Building on an older LTS base is the
    # standard AppImage practice for exactly this reason, and it's also
    # Tauri's own documented Linux CI baseline - the plain GitHub-hosted
    # runner has git/python/FUSE already, sidestepping every Arch-container
    # workaround (missing git, PEP 668 pip, missing FUSE, gdk-pixbuf loader
    # cache) this workflow needed before.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-appimage-ubuntu

      - name: Install system dependencies
        # Tauri's own documented Ubuntu prerequisite list, plus jq (version
        # injection below) and xdg-utils (linuxdeploy shells out to xdg-open
        # while bundling).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libxcb-composite0-dev \
            jq xdg-utils

      - name: Install pnpm
        run: npm install -g pnpm

      - uses: mtkennerly/dunamai-action@v1
        with:
          env-var: LUDUSAVI_VERSION
          args: --style semver

      - name: Inject version into tauri.conf.json
        run: |
          jq --arg v "$LUDUSAVI_VERSION" '.version = $v' \
            desktop/src-tauri/tauri.conf.json > desktop/src-tauri/tauri.conf.json.tmp
          mv desktop/src-tauri/tauri.conf.json.tmp desktop/src-tauri/tauri.conf.json

      - name: Build AppImage
        # Same script/recipe as local one-shot builds (README "Building" ->
        # desktop/scripts/build-appimage.sh) - one build process, not a second
        # CI-only one that can drift.
        run: ./desktop/scripts/build-appimage.sh

      - name: Rename AppImage with version
        run: mv Ludusavi-Sync.AppImage "Ludusavi-Sync-v${LUDUSAVI_VERSION}.AppImage"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: Ludusavi-Sync-v${{ env.LUDUSAVI_VERSION }}.AppImage
